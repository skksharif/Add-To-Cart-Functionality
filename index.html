    <header class="header">

                <p class="product__price">Rs 999/-</p>

                        <button class="product__decrease">-</button>
                        <input type="number" class="product__quantity-input" value="1" min="1" >
                        <button class="product__increase">+</button>
                    </div>
                    <button class="product__add-cart">Add to Cart</button>
